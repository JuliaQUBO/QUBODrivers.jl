name: Backfill Shared Labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview label changes without applying them.
        required: false
        default: true
        type: boolean
      max_items:
        description: Maximum number of open issues and PRs to scan.
        required: false
        default: 100
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SHARED_AUTOMATION_REF: 02781d5b27dd8f0d2bc5b1fe3845eff7113244ec
    steps:
      - name: Checkout shared automation repository
        uses: actions/checkout@v7
        with:
          repository: JuliaQUBO/.github
          ref: ${{ env.SHARED_AUTOMATION_REF }}
          path: shared

      - name: Backfill labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_ITEMS: ${{ inputs.max_items }}
        run: bash shared/.github/scripts/backfill-labels.sh
