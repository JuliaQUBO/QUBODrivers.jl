name: Label Pull Requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply path-based PR labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ github.token }}
          sync-labels: false
          configuration-path: .github/labeler.yml
